- name: Disable Continuity Clipboard (Universal Clipboard)
  osx_defaults:
    domain: com.apple.coreservices.useractivityd
    key: ClipboardSharingEnabled
    type: int
    value: 0
  register: clipboard_sharing
  tags:
    - defaults

- name: Restart useractivityd to apply the Continuity Clipboard change
  shell: killall useractivityd
  when: clipboard_sharing.changed
  tags:
    - defaults

- name: Install proximal Homebrew apps
  shell: brew bundle --file={{ role_path }}/files/Brewfile
  register: brew_diff
  changed_when: '"Installing" in brew_diff.stdout'

- name: Install proximal Homebrew apps - Changed output
  debug:
    var: brew_diff.stdout
  when:
    - brew_diff.changed
    - not ansible_check_mode
  changed_when: brew_diff.changed
