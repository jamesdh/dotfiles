# Portable Codex defaults only. Ansible deep-merges this fragment into
# ~/.codex/config.toml (see tasks/codex.yml); keys here win, everything else in
# the live file — [projects.*] trust levels, [hooks.state.*] trusted hashes,
# anything Codex writes for itself — is left alone and never tracked.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[tui]
status_line = ["model-with-reasoning", "context-used", "context-window-size", "used-tokens", "weekly-limit", "git-branch", "pull-request-number"]
status_line_use_colors = true

[notice]
hide_rate_limit_model_nudge = true
