---
# AgentBridge (abg) bridges Claude Code and Codex. Installed the way its README
# says — `npm install -g` — so abg's own update prompt (which runs
# `npm install -g …@latest`) and `abg doctor` match how it was installed. Bun is
# still its runtime (the CLI is `#!/usr/bin/env bun`, the plugin's MCP server is
# `bun run …`) and comes from Brewfile.nonpriority, which is why this is not
# tagged priority.
#
# The package's postinstall does the Claude Code wiring itself: it registers
# this install as the `agentbridge` plugin marketplace and installs the
# `agentbridge@agentbridge` plugin (best-effort; needs `bun` and `claude` on
# PATH, which they are when this runs from an interactive shell). On a global
# install it also stops any running AgentBridge daemons, so an upgrade restarts
# them — that is the intended upgrade path. Claude Code records the registered
# marketplace path in claude-settings.json (extraKnownMarketplaces) itself —
# don't hand-edit it there: the install lives under the active nvm Node version
# (~/.nvm/versions/node/<ver>/lib/node_modules), so the path changes with Node
# upgrades; after one, rerun this tag and the postinstall re-registers it.
- name: Install AgentBridge (abg) via npm
  community.general.npm:
    name: "@raysonmeng/agentbridge"
    global: true
