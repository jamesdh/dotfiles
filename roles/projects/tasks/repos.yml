---

- name: Get list of projects that already exist
  # shell: ls -d -1 "$PWD"*/*/
  shell: find "$PWD" -type d -maxdepth 2 -mindepth 2 -print
  args:
    chdir: "{{projects_dir}}"
  register: projects_ls
  changed_when: false
  check_mode: no
    
# I mostly just do this because "dotfiles" is initially checked out using https
# This takes care of fixing it so I can easily modify and push changes 
- name: Verify repo origin url for projects already in place
  git_config:
    scope: local
    repo: "{{projects_dir}}/{{item.0.org}}/{{item.1.name}}"
    name: remote.origin.url
    value: "git@github.com:{{item.0.org}}/{{item.1.name}}.git"
  with_subelements:
    - "{{github}}"
    - repos
  when:
    - item.0.org in active_project_owners
    - "[item.0.org,item.1.name] | join('/') in projects_ls.stdout"
  tags:
    - priority

- name: Setup git repositories 
  git:
    repo: "git@github.com:{{item.0.org}}/{{item.1.name}}.git"
    dest: "{{projects_dir}}/{{item.0.org}}/{{item.1.name}}"
    accept_hostkey: true
  with_subelements:
    - "{{github}}"
    - repos
  when:
    - item.0.org in active_project_owners
    - "not [item.0.org,item.1.name] | join('/') in projects_ls.stdout"

- name: Setup repo pre-commit hooks
  file: 
    src: "{{role_path}}/files/{{item.file}}"
    path: "{{item.path}}/.git/hooks/pre-commit"
    state: link
    force: true
  loop: "{{hooks}}"
  tags: 
    - hooks

- name: Setup repo env files
  file:
    src: "{{role_path}}/files/{{item.src}}"
    path: "{{item.dest}}/.env"
    state: link
    force: true
  loop: "{{envfiles}}"
  when: item.owner in active_project_owners
  tags:
    - envfiles

- name: Link op-fast .envrc into env-file repos
  file:
    src: "{{role_path}}/files/.envrc"
    path: "{{item.dest}}/.envrc"
    state: link
    force: true
  loop: "{{envfiles}}"
  when: item.owner in active_project_owners
  tags:
    - envfiles

- name: Allow direnv on env files
  shell: direnv allow
  args:
    chdir: "{{item.dest}}"
  loop: "{{envfiles}}"
  when: item.owner in active_project_owners
  changed_when: false
  tags:
    - envfiles

- name: Link workspace .env / .envrc files
  file:
    src: "{{role_path}}/files/{{item.src}}"
    path: "{{item.dest}}"
    state: link
    force: true
  loop:
    - { src: "projects.env",   dest: "{{projects_dir}}/.env" }
    - { src: "projects.envrc", dest: "{{projects_dir}}/.envrc" }
    - { src: "mb.env",         dest: "{{projects_dir}}/moltenbits/.env", owner: moltenbits }
    - { src: "mb.envrc",       dest: "{{projects_dir}}/moltenbits/.envrc", owner: moltenbits }
    - { src: "jamesdh.envrc",  dest: "{{projects_dir}}/jamesdh/.envrc", owner: jamesdh }
  when: item.owner is not defined or item.owner in active_project_owners
  tags:
    - envfiles

- name: Allow direnv on workspace dirs
  shell: direnv allow
  args:
    chdir: "{{item.path}}"
  loop:
    - { path: "{{projects_dir}}" }
    - { path: "{{projects_dir}}/moltenbits", owner: moltenbits }
    - { path: "{{projects_dir}}/jamesdh", owner: jamesdh }
  loop_control:
    label: "{{ item.path }}"
  when: item.owner is not defined or item.owner in active_project_owners
  changed_when: false
  tags:
    - envfiles

- name: Link Makefiles to relevant Projects dir
  file:
    src: "{{role_path}}/files/{{item.file}}"
    path: "{{item.path}}/Makefile"
    state: link
    force: true
  loop: "{{makefiles}}"
  when: item.owner is not defined or item.owner in active_project_owners
  tags:
    - makefiles
