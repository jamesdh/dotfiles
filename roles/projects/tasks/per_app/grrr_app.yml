---

- name: "Setup growlrrr app: {{ item.appId }}"
  block:

  - name: "Check if grrr {{ item.appId }} app exists"
    stat:
      path: "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app"
    register: grrr_app

  - name: "Create grrr {{ item.appId }} app"
    command: "grrr apps add --appId {{ item.appId }}{{ ' --appIcon ' ~ item.icon if item.icon is defined else '' }}"
    when: not grrr_app.stat.exists

  - name: "Create {{ item.appId }} agent config directories"
    file:
      path: "{{ agent_config_dir }}"
      state: directory
      mode: 0755
    loop:
      - "{{ item.claude_settings_dir }}"
      - "{{ item.claude_settings_dir | dirname }}/.codex"
    loop_control:
      loop_var: agent_config_dir

  - name: "Generate {{ item.appId }} Claude notification hooks"
    command:
      argv:
        - growlrrr
        - init
        - --format
        - claude
        - --appId
        - "{{ item.appId }}"
    register: grrr_claude_config
    changed_when: false
    check_mode: no

  - name: "Configure {{ item.appId }} Claude notification hooks"
    copy:
      dest: "{{ item.claude_settings_dir }}/settings.json"
      content: "{{ grrr_claude_config.stdout }}\n"

  - name: "Generate {{ item.appId }} Codex notification hooks"
    command:
      argv:
        - growlrrr
        - init
        - --format
        - codex
        - --appId
        - "{{ item.appId }}"
    register: grrr_codex_config
    changed_when: false
    check_mode: no

  - name: "Configure {{ item.appId }} Codex notification hooks"
    copy:
      dest: "{{ item.claude_settings_dir | dirname }}/.codex/config.toml"
      content: "{{ grrr_codex_config.stdout }}\n"

  tags:
    - grrr
