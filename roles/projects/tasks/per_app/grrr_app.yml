---

- name: "Setup growlrrr app: {{ item.appId }}"
  block:

  - name: "Check if grrr {{ item.appId }} app exists"
    stat:
      path: "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app"
    register: grrr_app

  - name: "Create grrr {{ item.appId }} app"
    command: "grrr apps add --appId {{ item.appId }}{{ ' --appIcon ' ~ item.icon if item.icon is defined else '' }}"
    when: not grrr_app.stat.exists

  # Notification authorization belongs to each custom app's bundle identifier, so the
  # status and request must run through that app's executable rather than the main CLI.
  # This block is interactive only when authorization is missing and is excluded from
  # normal installs by the Makefile's --skip-tags=permissions.
  - name: "Authorize {{ item.appId }} Growlrrr notifications"
    tags:
      - permissions
    block:
      - name: "Read {{ item.appId }} notification authorization"
        ansible.builtin.command:
          argv:
            - "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app/Contents/MacOS/growlrrr"
            - authorize
            - --status
        register: grrr_notification_initial_status
        changed_when: false
        check_mode: no

      # Launch the request through Launch Services so the custom app and its native prompt
      # detach cleanly while Ansible owns the interactive wait below.
      - name: "Request {{ item.appId }} notification authorization"
        ansible.builtin.command:
          argv:
            - open
            - -n
            - "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app"
            - --args
            - authorize
        when:
          - not ansible_check_mode
          - "'Status: not determined' in grrr_notification_initial_status.stdout"

      - name: "Wait while {{ item.appId }} notification authorization is requested"
        ansible.builtin.pause:
          prompt: |-
            Approve {{ item.appId }}'s notification prompt.
            Press Enter when done.
        when:
          - not ansible_check_mode
          - "'Status: not determined' in grrr_notification_initial_status.stdout"

      - name: "Re-read {{ item.appId }} notification authorization"
        ansible.builtin.command:
          argv:
            - "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app/Contents/MacOS/growlrrr"
            - authorize
            - --status
        register: grrr_notification_current_status
        changed_when: false
        check_mode: no

      # macOS only presents the native authorization dialog once. If permission was
      # denied (or remains provisional), open Notification Settings for manual recovery.
      - name: "Open Notification Settings for {{ item.appId }}"
        ansible.builtin.command:
          argv:
            - "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app/Contents/MacOS/growlrrr"
            - authorize
            - --open-settings
        changed_when: false
        when:
          - not ansible_check_mode
          - "'Status: authorized' not in grrr_notification_current_status.stdout"

      - name: "Wait while {{ item.appId }} notifications are enabled"
        ansible.builtin.pause:
          prompt: |-
            {{ item.appId }} still needs notification authorization.
            Enable notifications for it in System Settings.
            Press Enter when done.
        when:
          - not ansible_check_mode
          - "'Status: authorized' not in grrr_notification_current_status.stdout"

      - name: "Verify {{ item.appId }} notification authorization"
        ansible.builtin.command:
          argv:
            - "{{ home_dir }}/.growlrrr/apps/{{ item.appId }}.app/Contents/MacOS/growlrrr"
            - authorize
            - --status
        register: grrr_notification_final_status
        changed_when: false
        check_mode: no

      - name: "Require {{ item.appId }} notification authorization"
        ansible.builtin.assert:
          that:
            - "'Status: authorized' in grrr_notification_final_status.stdout"
          fail_msg: >-
            {{ item.appId }} notifications are not authorized
            ({{ grrr_notification_final_status.stdout | trim }}).
        when: not ansible_check_mode

  - name: "Configure {{ item.appId }} repository agent hooks"
    when: item.claude_settings_dir is defined
    block:
      - name: "Create {{ item.appId }} agent config directories"
        file:
          path: "{{ agent_config_dir }}"
          state: directory
          mode: 0755
        loop:
          - "{{ item.claude_settings_dir }}"
          - "{{ item.claude_settings_dir | dirname }}/.codex"
        loop_control:
          loop_var: agent_config_dir

      - name: "Generate {{ item.appId }} Claude notification hooks"
        command:
          argv:
            - growlrrr
            - init
            - --format
            - claude
            - --appId
            - "{{ item.appId }}"
        register: grrr_claude_config
        changed_when: false
        check_mode: no

      - name: "Configure {{ item.appId }} Claude notification hooks"
        copy:
          dest: "{{ item.claude_settings_dir }}/settings.json"
          content: "{{ grrr_claude_config.stdout }}\n"

      - name: "Generate {{ item.appId }} Codex notification hooks"
        command:
          argv:
            - growlrrr
            - init
            - --format
            - codex
            - --appId
            - "{{ item.appId }}"
        register: grrr_codex_config
        changed_when: false
        check_mode: no

      - name: "Configure {{ item.appId }} Codex notification hooks"
        copy:
          dest: "{{ item.claude_settings_dir | dirname }}/.codex/config.toml"
          content: "{{ grrr_codex_config.stdout }}\n"

  tags:
    - grrr
