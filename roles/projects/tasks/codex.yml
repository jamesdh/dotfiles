---
- name: Ensure ~/.codex exists
  file:
    path: "{{home_dir}}/.codex"
    state: directory

# Codex (and most non-Anthropic agents) read AGENTS.md, not CLAUDE.md. Point
# Codex's global AGENTS.md at the same source as ~/.claude/CLAUDE.md so both
# tools share a single set of global instructions.
- name: Link global instructions to ~/.codex/AGENTS.md
  file:
    src: "{{role_path}}/files/agents.md"
    path: "{{home_dir}}/.codex/AGENTS.md"
    state: link
    force: true

# Named codex-config.toml because files/ already holds other tools' configs.
#
# Not a symlink: Codex writes machine-specific state into the same file it reads
# config from — [projects.<abs path>] trust levels and [hooks.state.<abs path>]
# trusted hashes (openai/codex#14601, still open) — so a linked file drifts on
# every machine. Instead the repo holds only portable defaults and they are
# deep-merged into the live file: tracked keys win, untracked keys survive.
# model is tracked; model_reasoning_effort is deliberately not, so it stays
# per-machine. A leftover symlink from the old setup is read through, then
# replaced by a real file.
- name: Check for existing Codex config
  stat:
    path: "{{home_dir}}/.codex/config.toml"
  register: codex_config_stat

- name: Read existing Codex config
  slurp:
    src: "{{home_dir}}/.codex/config.toml"
  register: codex_config_existing
  when: codex_config_stat.stat.exists

- name: Remove legacy Codex config symlink
  file:
    path: "{{home_dir}}/.codex/config.toml"
    state: absent
  when: codex_config_stat.stat.islnk | default(false)

- name: Merge tracked Codex defaults into ~/.codex/config.toml
  copy:
    content: >
      {{ (codex_config_existing.content | b64decode | community.general.from_toml
          if codex_config_stat.stat.exists else {})
         | combine(lookup('file', role_path ~ '/files/codex-config.toml') | community.general.from_toml, recursive=true)
         | community.general.to_toml }}
    dest: "{{home_dir}}/.codex/config.toml"
    mode: "0600"
