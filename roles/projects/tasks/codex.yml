---
- name: Ensure ~/.codex exists
  file:
    path: "{{home_dir}}/.codex"
    state: directory

# Codex (and most non-Anthropic agents) read AGENTS.md, not CLAUDE.md. Point
# Codex's global AGENTS.md at the same source as ~/.claude/CLAUDE.md so both
# tools share a single set of global instructions.
- name: Link global instructions to ~/.codex/AGENTS.md
  file:
    src: "{{role_path}}/files/agents.md"
    path: "{{home_dir}}/.codex/AGENTS.md"
    state: link
    force: true

# Named codex-config.toml because files/ already holds other tools' configs.
# Like claude-settings.json, Codex writes this file itself (/model, project
# trust approvals, `codex mcp add`), so it will show as modified here after any
# such change — that is the point. Codex resolves the symlink and edits the
# target in place (openai/codex#9445), so the link survives those writes.
- name: Link Codex config to ~/.codex/
  file:
    src: "{{role_path}}/files/codex-config.toml"
    path: "{{home_dir}}/.codex/config.toml"
    state: link
    force: true
