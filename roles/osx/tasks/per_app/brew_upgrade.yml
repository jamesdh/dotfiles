# The nightly agent downloads upgrades at 02:00. A second user-session agent watches for
# a login/unlock and runs `brew upgrade` once when a downloaded set is pending. Both plists
# point at the same script in this repo, so script edits take effect without re-running Ansible.
- name: Install the nightly Homebrew download LaunchAgent
  template:
    src: com.jamesdh.brew-upgrade.plist.j2
    dest: "{{ home_dir }}/Library/LaunchAgents/com.jamesdh.brew-upgrade.plist"
    mode: 0644
  register: brew_upgrade_plist

- name: Reload the nightly Homebrew download LaunchAgent
  shell: |
    launchctl bootout gui/{{ ansible_user_uid }}/com.jamesdh.brew-upgrade 2>/dev/null || true
    launchctl bootstrap gui/{{ ansible_user_uid }} {{ home_dir }}/Library/LaunchAgents/com.jamesdh.brew-upgrade.plist
  when:
    - brew_upgrade_plist.changed
    - not ansible_check_mode

- name: Install the Homebrew login and unlock watcher LaunchAgent
  template:
    src: com.jamesdh.brew-upgrade-watcher.plist.j2
    dest: "{{ home_dir }}/Library/LaunchAgents/com.jamesdh.brew-upgrade-watcher.plist"
    mode: 0644
  register: brew_upgrade_watcher_plist

- name: Reload the Homebrew login and unlock watcher LaunchAgent
  shell: |
    launchctl bootout gui/{{ ansible_user_uid }}/com.jamesdh.brew-upgrade-watcher 2>/dev/null || true
    launchctl bootstrap gui/{{ ansible_user_uid }} {{ home_dir }}/Library/LaunchAgents/com.jamesdh.brew-upgrade-watcher.plist
  when:
    - brew_upgrade_watcher_plist.changed
    - not ansible_check_mode
