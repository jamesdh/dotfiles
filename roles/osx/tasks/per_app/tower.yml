# Register Tower via its license deep link (the 1Password Git-tower item's registration
# URL) and pause while the few first-run dialogs are clicked through by hand — replacing
# the old cliclick coordinate choreography, which was far too brittle across displays.
- name: Check for Tower license file
  stat:
    path: "{{ tower.license_path }}"
  register: tower_license
  tags:
    - tower
    - settings

- name: Register Tower
  when: not tower_license.stat.exists
  tags:
    - tower
    - settings
    - permissions
  block:
    - name: Open Tower with the dotfiles repo
      ansible.builtin.shell: "open -Fna 'Tower' --args {{ projects_dir }}/jamesdh/dotfiles && sleep 1"

    - name: Open the Tower license URL
      ansible.builtin.command:
        argv: [open, -u, "{{ tower.license_url }}"]

    - name: Wait while Tower's registration is completed
      ansible.builtin.pause:
        prompt: |-
          Finish Tower's registration in the dialogs that just opened (agree to the
          license, then dismiss the first-run prompts).
          Press Enter when done.
